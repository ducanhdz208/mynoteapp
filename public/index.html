<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Premium Notes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div id="app">
        <!-- Login screen -->
        <div v-if="!isAuthenticated" class="login-screen">
            <div class="glass login-box">
                <h1>🔒 Secure Notes</h1>
                <p class="login-instruction">Enter your master password.</p>
                <input
                    type="password"
                    v-model="passwordInput"
                    placeholder="Password"
                    @keyup.enter="login"
                >
                <button @click="login">Unlock</button>
            </div>
        </div>

        <!-- Application layout -->
        <div
            v-else
            id="app-layout"
            :class="{ 'mobile-note-open': isMobileNoteOpen }"
        >
            <!-- Notes list -->
            <div class="sidebar glass">
                <div class="header">
                    <h1>My Notes</h1>
                </div>
                <button class="new-btn" @click="createNewNote">
                    + Create New Note
                </button>
                <div class="note-list">
                    <div
                        v-for="note in notes"
                        :key="note.id"
                        class="course-item"
                        :class="{ active: currentNote && currentNote.id === note.id }"
                        @click="selectNote(note)"
                    >
                        <div class="title">
                            {{ note.title || 'Untitled Note' }}
                        </div>
                        <div class="preview-text">
                            {{ getPreviewText(note.content) }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Note editor -->
            <div v-if="currentNote" class="main-content glass">
                <button class="mobile-back-btn" @click="closeMobileNote">
                    ← Back to Notes
                </button>
                <input
                    class="title-input"
                    v-model="currentNote.title"
                    placeholder="Note Title..."
                    @input="saveNote"
                >

                <div class="controls">
                    <button
                        class="btn btn-edit"
                        @click="isEditing = !isEditing"
                    >
                        {{ isEditing ? '👁️ View Beautiful Version' : '✏️ Edit Markdown' }}
                    </button>
                    <button
                        class="btn btn-delete"
                        @click="deleteNote(currentNote.id)"
                    >
                        Delete
                    </button>
                </div>

                <div class="workspace">
                    <textarea
                        v-if="isEditing"
                        class="editor-pane"
                        v-model="currentNote.content"
                        placeholder="Type your markdown here..."
                        @input="saveNote"
                    ></textarea>
                    <div
                        v-else
                        class="preview-pane"
                        v-html="renderedMarkdown"
                    ></div>
                </div>
            </div>

            <!-- Desktop empty state -->
            <div v-else class="main-content glass empty-state">
                <h2>Select or create a note to start</h2>
            </div>
        </div>
    </div>
</body>
</html>
